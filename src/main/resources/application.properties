spring.application.name=maricielojoyas
spring.config.import=optional:file:./application-local.properties
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/maricielojoyas}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima
spring.sql.init.mode=never
server.error.include-message=never
cielo.whatsapp=${WHATSAPP:}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# CCI de la tienda. PAYMENT_CCI permite sustituirlo en otro entorno.
cielo.payment.cci=${PAYMENT_CCI:00238012593976701545}

# Fotos de reseñas fuera del directorio público; conservar esta carpeta en respaldos.
cielo.reviews.upload-dir=${REVIEW_UPLOAD_DIR:uploads/reviews}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Correo del pedido. Activar únicamente con un servidor SMTP real configurado.
cielo.mail.enabled=${MAIL_ENABLED:false}
cielo.mail.from=${MAIL_FROM:${SMTP_FROM:}}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:${SMTP_PASS:}}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SECURE:false}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
